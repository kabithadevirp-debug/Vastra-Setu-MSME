server.port=8085
spring.application.name=vastrasetu-backend

# PostgreSQL Datasource Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vastrasetu_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring SQL Initialization
spring.sql.init.mode=always

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application JWT & Security Config
vastrasetu.jwt.secret=vastrasetu_jwt_secret_key_production_2026_super_secure_spring_boot
vastrasetu.jwt.access-token-expiration-ms=1800000
vastrasetu.jwt.refresh-token-expiration-ms=604800000

# OpenRouter AI API Configuration (Externalized via Environment Variable OPENROUTER_API_KEY)
vastrasetu.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
vastrasetu.ai.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}

# Spring Mail (Gmail SMTP) Configuration (Externalized via Environment Variable SPRING_MAIL_PASSWORD)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
